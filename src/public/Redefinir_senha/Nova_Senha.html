<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar nova senha</title>

    <!---Ícone (logo) no navegador: chamada "favicon"-->
    <link rel="icon" type="image/png" href="../images/icone_NotaDez.png">
    <link rel="stylesheet" href="estiloNovaSenha.css">

    <!--importação da fonte Comfortaa pelo Google Fonts-->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet"> 
</head>
<body>
    <div class="container">

        <img src="../images/logo_NotaDez.png" alt="ícone usuário" class="icon">

        <h1>Alterar Senha</h1>

        <form>
            <!--Campos para digitar a nova senha e confirmar ela-->
            <label for="nova-senha">Nova senha: <span class="asterisco">*</span></label>
            <div class="senhabox">
                <img src="../images/icone_cadeado.png" alt="" class="cadeado1">
                <input type="password" id="nova-senha" name="nova-senha" class="senha" placeholder="Digite sua nova senha" required>
            </div>
            <small class="hint">Mínimo 8 caracteres, com ao menos: 1 maiúscula, 1 minúscula, 1 número e 1 símbolo.</small>
            <span id="erroSenha" class="erro"></span>
            
            <label for="confirmar-senha" class="textconfirmar">Confirme a nova senha: <span class="asterisco">*</span></label>
            <div class="confirmarbox">
                <img src="../images/icone_cadeado.png" alt="" class="cadeado2">
                <input type="password" id="confirmar-senha" name="confirmar-senha" class="confirmarsenha" placeholder="Confirme sua nova senha" required>
            </div>
            <span id="erroConfirmarSenha" class="erro"></span>

            <!--Botão para confirmar a mudança de senha-->
            <button type="submit">Alterar Senha</button>
        </form>
    </div>

    <!-- Script para validação e sucesso -->
    <script src="Nova_Senha.js"></script>
</body>
</html>
